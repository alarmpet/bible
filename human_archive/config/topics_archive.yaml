version: 2
pipeline: "human_archive"
channel_concept: "인류의 서재 (Human Archive) — 인류사, 고고학, 사료 비평, 문명 붕괴, 실존적 다큐멘터리"
categories:
  - id: "disaster_history"
    name: "파멸적 대재앙과 제국 멸망사 (Catastrophic Collapses)"
    topics:
      - title: "폼페이 최후의 18시간 — 왜 그들은 하룻밤 동안 도시를 떠나지 못했을까?"
        keywords: ["폼페이", "베수비오", "로마 제국", "재앙 심리학", "플리니우스"]
      - title: "타이타닉 침몰 160분 — 가장 부유했던 자들이 얼어붙은 바다로 걸어 들어간 이유"
        keywords: ["타이타닉", "선택", "계급", "생존", "빙산"]
      - title: "청동기 시대의 대붕괴 — 지중해 최강의 문명들이 50년 만에 일제히 증발한 진실"
        keywords: ["바다 민족", "기후 변화", "문명 붕괴", "히타이트", "미케네"]
      - title: "인류 역사상 가장 잔혹했던 흑사병 — 중세 유럽 봉건제를 단숨에 무너뜨린 죽음의 행렬"
        keywords: ["흑사병", "페스트", "중세 종말", "사회 변혁", "인구 격감"]

  - id: "sacred_lore_and_texts"
    name: "금지된 고문서와 종교 사료 비평 (Forbidden Lore & Texts)"
    topics:
      - title: "성경은 왜 이 기록들을 숨겼을까? — 사해문서와 사라진 외경들의 진실"
        keywords: ["사해문서", "쿰란", "에녹서", "문헌학", "성서 고고학"]
      - title: "수메르 점토판이 증언하는 인류 창조 — 쐐기문자가 밝혀낸 가장 오래된 대홍수 기록"
        keywords: ["길가메시 서사시", "수메르", "메소포타미아", "대홍수", "지우수드라"]
      - title: "천사와 악마의 기원 — 고대 조로아스터교가 유대·기독교 세계관에 미친 충격적 영향"
        keywords: ["조로아스터교", "이원론", "천사론", "악마학", "종교 비교학"]

  - id: "ancient_mysteries"
    name: "인류 기원과 미스터리 유적 (Lost Origins & Megaliths)"
    topics:
      - title: "괴베클리 테페의 충격 — 농경보다 신전이 먼저 지어졌다는 1만 2천 년 전 고고학의 반전"
        keywords: ["괴베클리 테페", "선사시대", "종교의 기원", "수렵채집인", "거석 유적"]
      - title: "93만 년 전 인류 멸종의 위기 — 지구상에 남은 인간이 단 1,280명뿐이었을 때"
        keywords: ["인구 병목", "유전학", "호모 에렉투스", "생존", "DNA 분석"]
      - title: "인더스 문명의 수수께끼 — 전쟁의 흔적도, 왕의 궁전도 없는 5천 년 전 완벽한 평화 도시"
        keywords: ["모헨조다로", "하랍파", "상하수도", "문자 미해독", "평등 사회"]

  - id: "existential_philosophy"
    name: "역사를 바꾼 결정적 사상과 철학 (Existential Philosophy)"
    topics:
      - title: "로마 최후의 성군 마르쿠스 아우렐리우스 — 역병과 배신 속에서 쓴 스토아 철학의 정수"
        keywords: ["명상록", "스토아 철학", "안토니누스 역병", "자기 통제", "죽음관"]
      - title: "이스터 섬의 비극 — 거대 석상(모아이)을 위해 숲을 모두 베어버린 인간의 광기"
        keywords: ["모아이", "생태 파괴", "자원 고갈", "라파누이", "문명 경고"]

  - id: "korean_joseon_mysteries"
    name: "조선 왕실 비사와 실록 팩트체크 (Joseon Royal Secrets & Fact-check)"
    topics:
      - title: "장희빈은 정말 사약을 마시며 발악했을까? — 숙종실록과 승정원일기가 숨긴 진짜 최후"
        keywords: ["장희빈", "숙종", "인현왕후", "사약", "실록 팩트체크", "승정원일기"]
      - title: "하룻밤에 끝내는 단종의 비극 — 세조는 왜 조카의 목숨을 끝내 거두어야만 했는가"
        keywords: ["단종", "세조", "계유정난", "사육신", "영월 유배", "왕권 갈등"]
      - title: "사도세자의 뒤주 속 8일 — 한중록과 영조실록이 엇갈리는 광기와 비극의 실체"
        keywords: ["사도세자", "영조", "정조", "한중록", "뒤주", "임오화변"]
      - title: "광해군은 왜 폭군으로 낙인찍혔나? — 대동법과 중립외교를 둘러싼 붕당의 음모"
        keywords: ["광해군", "인조반정", "중립외교", "대동법", "명청교체기", "역사 재평가"]


