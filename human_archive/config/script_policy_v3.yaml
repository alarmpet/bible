# 놀람파일 대본 정책 v3 — 인류의 서재 벤치마크 기반
# 20분 롱폼 시네마틱 다큐멘터리 대본 생성 규칙

policy_id: nollam_script_policy_v3
profile_id: nollam_file_v1
delivery_profile_id: trend_explainer_20m

# 문장 규격
sentence:
  avg_chars: 28                    # 평균 28자 (벤치마크 실측 중앙값)
  min_chars: 12                    # 최소 12자
  max_chars: 45                    # 최대 45자
  target_tts_sec: 4.75             # TTS 목표 4.75초/문장
  min_tts_sec: 2.5                 # TTS 최소 2.5초
  max_tts_sec: 7.0                 # TTS 최대 7.0초

# 어투 비율 (불변 제약)
tone_ratio:
  formal_endings: 0.60             # ~습니다/~였습니다/~합니다 (격식체)
  casual_endings: 0.40             # ~해요/~죠/~거든요 (친근체)
  tolerance: 0.05                  # ±5% 허용 범위

# 질문 배치 규칙
question_cadence:
  interval_sec: 40                 # 40초마다 최소 1개 의문문
  min_per_episode: 25              # 편당 최소 25개
  max_per_episode: 35              # 편당 최대 35개
  types:
    - rhetorical                   # 수사적 질문 ("~일까요?")
    - socratic                     # 반문형 ("그런데 왜?")
    - cliffhanger                  # 서스펜스형 ("~라면 어떻게 될까요?")

# 전환어 밀도
transition_density:
  target_per_minute: 1.15          # 분당 1.15회 (벤치마크: 1.0~1.3)
  primary_markers: ["그런데", "하지만", "놀라운 것은", "문제는", "흥미로운 점은"]
  secondary_markers: ["사실", "결국", "다시 말해", "즉"]

# 5단계 스토리텔링 구간 비율
story_phases:
  phase_1_hook:
    time_range_pct: [0, 10]        # 0~10% (0~2분)
    first_reversal_max_sec: 20     # 첫 반전 ≤ 20초
    core_question_max_sec: 40      # 중심 질문 ≤ 40초
    roadmap_end_max_sec: 120       # 로드맵 종료 ≤ 120초
    cold_open_sentences: 4         # 첫 15초 내 4문장
  phase_2_context:
    time_range_pct: [10, 30]       # 10~30% (2~6분)
  phase_3_evidence:
    time_range_pct: [30, 70]       # 30~70% (6~14분)
    sub_chapters: [2, 3]           # 2~3개 서브 챕터 분할
  phase_4_paradigm_shift:
    time_range_pct: [70, 90]       # 70~90% (14~18분)
  phase_5_outro:
    time_range_pct: [90, 100]      # 90~100% (18~20분)
    signature_closing: true        # 브랜드 시그니처 멘트 필수

# 금지 패턴
prohibited_patterns:
  - "오늘 영상에서는"
  - "구독과 좋아요"
  - "다음 영상에서"
  - "영상을 끝까지"
  - "좋아요를 눌러"
  - "알림 설정"
  - "에헴"
  - "소생이 보건대"
  - "기가 막히지요"

# 4-Step Claude 체인 설정
claude_chain:
  step_1_outline:
    model: claude-sonnet-4-20250514
    max_tokens: 4096
    output: narrative_outline_v2
  step_2_enrichment:
    model: claude-sonnet-4-20250514
    max_tokens: 8192
    output: fact_enriched_outline
    required_sources: ["Nature", "Science", "PNAS", "KCI", "government_report"]
  step_3_script:
    model: claude-sonnet-4-20250514
    max_tokens: 16384
    template: nollam_script_prompt_v3.j2
    output: scene_script_with_prompts
  step_4_rhythm_qa:
    model: claude-haiku-4-20250414
    max_tokens: 4096
    checks:
      - sentence_length_compliance
      - tone_ratio_compliance
      - question_cadence_compliance
      - transition_density_compliance
      - slop_pattern_removal
