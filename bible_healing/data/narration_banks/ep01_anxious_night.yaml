# Expanded dual-voice narration for ~100 min (with verse DB text)
# Speakers only in opening/closing lists; units use before/mid/after (all narrator)

# 저작권·의료 면책 고지는 낭독에 넣지 않음 → 유튜브 설명/고정댓글 (config/licenses.yaml)
opening:
  - speaker: narrator
    text: >
      이 시간은 가르침을 위한 시간이 아닙니다.
      단지, 오늘 하루를 버티느라 지친 마음이 잠시 숨을 고를 수 있도록
      오래된 말씀을 천천히 읽어 드리는 시간입니다.
      이어폰을 끼셨든, 스피커로 틀어 두셨든, 지금 이 공간이 잠시 당신만의 쉼터가 되기를 바랍니다.
  - speaker: narrator
    text: >
      자, 어깨에 힘을 조금 빼고, 숨을 한 번만 깊게 들이쉬어 보세요.
      들이쉴 때 코로, 내쉴 때 입으로, 천천히.
      오늘 밤의 주제는 불안입니다.
      불안은 당신을 실패한 사람으로 만들지 않습니다.
      다만, 그만큼 무언가를 아끼고 지키고 살아 왔다는 신호일 수도 있습니다.
      불안한 밤을 위한 말씀을 시작합니다.

units:
  u01:
    title: 잠들기 전, 마음이 멈출 때
    before: >
      잠자리에 누웠는데 생각이 멈추지 않을 때가 있습니다.
      오늘 한 말, 내일 해야 할 일, 아직 해결되지 않은 걱정들이
      어둠 속에서 더 크게 들리는 밤.
      불은 껐는데 머릿속만 환하게 켜져 있는 그 시간.
      시편 기자는 그런 밤을 이미 알고 있었습니다.
      자랑할 수 없는 두려움, 남에게 말하기 쑥스러운 걱정,
      그런 것들을 시편은 시로 남겼습니다.
      지금부터 시편 사 편을 천천히 듣겠습니다.
      구절이 흐르는 동안, 해석하려 애쓰지 않으셔도 됩니다.
      다만 문장 하나가 마음에 걸리면, 그 문장 옆에 잠시 머물러도 좋습니다.
    mid: >
      이 시편에는 원통함도 있고, 탄식도 있고, 동시에 평안히 눕겠다는 결심도 있습니다.
      감정이 하나로 정리되지 않는 밤의 모습과 닮아 있습니다.
      당신 안에도 여러 감정이 한꺼번에 있을 수 있습니다.
      그건 혼란이 아니라, 살아 있는 마음의 다층성일 수 있습니다.
    after: >
      ‘평안히 눕고 잔다’는 말은, 모든 문제가 사라진 뒤에야 잠든다는 뜻이 아닙니다.
      문제가 남아 있어도, 그 한가운데서 숨을 맡길 곳이 있다는 고백에 가깝습니다.
      오늘 밤, 해결되지 않은 목록을 잠시 옆에 두어도 됩니다.
      목록이 사라지지 않아도, 당신은 잠시 눈을 감을 자격이 있습니다.
      완벽하지 않은 하루의 끝에도 쉼은 허락됩니다.
      당신은 혼자가 아닙니다.
      잠시 침묵 속에서, 어깨를 침대에 맡겨 보세요.

  u02:
    title: 둘러싸인 것처럼 느껴질 때
    before: >
      가끔은 걱정이 한두 개가 아니라, 사방에서 동시에 밀려오는 것처럼 느껴집니다.
      업무 알림, 관계의 말들, 건강, 돈, 앞날.
      시편 삼 편에서 다윗은 ‘대적하는 자가 많으니이다’라고 말합니다.
      오늘의 언어로 옮기면, 압박과 불안이 한꺼번에 몰려올 때의 고백입니다.
      많은 것이 나를 향하고 있다고 느낄 때, 숨이 얕아집니다.
      그럴 때일수록, 천천히 읽어 주는 한 편의 시가 필요할 때가 있습니다.
    mid: >
      이 시편은 위협을 부정하지 않습니다.
      없다고 우기지 않습니다.
      오히려 ‘많다’고 먼저 인정합니다.
      인정 뒤에 나오는 신뢰가, 억지 긍정이 아니라 선택처럼 들립니다.
    after: >
      두려워하는 마음이 약함의 증거가 아닙니다.
      그 두려움을 입 밖으로 내어 놓은 순간, 이미 한 걸음을 옮긴 것일 수 있습니다.
      지금 당신 마음에 이름을 붙일 수 있는 걱정이 있다면,
      그것을 숨기지 않아도 괜찮습니다.
      이름을 붙이면, 때로는 그 크기가 조금 선명해지고,
      선명해지면 다룰 수 있는 부분이 보이기도 합니다.
      오늘은 ‘전부 해결’이 목표가 아니어도 됩니다.
      ‘하나만이라도 내려놓기’면 충분합니다.

  u03:
    title: 지친 영혼을 위한 목자
    before: >
      시편 이십삼 편은 많은 이들이 알고 있는 구절이지만,
      잘 안다고 해서 오늘 밤의 위로가 사라지지는 않습니다.
      오히려, 익숙한 문장이 가장 깊은 곳에서 우리를 붙들 때가 있습니다.
      피곤한 날일수록 새로운 정보보다, 오래 곁에 있던 문장이 필요할 수 있습니다.
      목자와 양의 이미지는 현대의 언어로 바꾸면,
      나를  ind 방향으로 몰아붙이지 않고, 쉴 자리로 이끄시는 돌봄에 가깝습니다.
    mid: >
      ‘그가 나를 푸른 초장에 누이시며’라는 문장을 떠올려 보세요.
      누인다는 것은 성과를 더 짜내는 자세가 아닙니다.
      잠시 무게를 내려놓는 허락입니다.
      오늘 당신이 스스로에게 그 허락을 줄 수 있을까요.
    after: >
      ‘내가 부족함이 없으리로다’는 물질이 넉넉하다는 선언이 아니라,
      이 길 위에서 내가 버려지지 않았다는 신뢰에 가깝습니다.
      오늘 하루 애쓴 당신 자신을, 조금은 다정하게 바라보아 주세요.
      부족해 보이는 결과 뒤에도, 견뎌 낸 시간이 있었습니다.
      당신은 이미 충분히 걸어왔습니다.
      남은 길은 내일의 몫으로 남겨 두어도 좋습니다.

  u04:
    title: 두려움을 밝히는 빛
    before: >
      마음이 어두울 때는 작은 소리에도 깜짝 놀랍니다.
      전화 알림 하나, 스치는 생각 하나가 과하게 크게 들립니다.
      시편 이십칠 편은 그 어둠 한가운데서
      ‘여호와는 나의 빛이요 구원이시니 내가 누구를 두려워하리요’라고 말합니다.
      빛이 먼저 오고, 그다음에 용기가 따라옵니다.
      용기가 먼저 생겨야 빛이 오는 것이 아닐 수 있습니다.
    mid: >
      이 구절은 두려움을 무시한 채 앞으로 돌진하라는 구호가 아닙니다.
      빛이 있다는 사실을 먼저 상기시키는 노래입니다.
      어두운 방에서 스위치 위치를 떠올리는 일과 비슷합니다.
    after: >
      용기는 두려움이 없는 상태가 아닙니다.
      두려움이 있어도, 그 옆에서 한 발짝을 내딛는 일입니다.
      오늘 당신에게 필요한 용기가 ‘전부 해결하는 것’이 아니라
      ‘오늘 밤을 넘기는 것’이어도 충분합니다.
      작은 용기를 스스로를 향해 인정해 주세요.
      여기까지 온 것, 그것만으로도 이미 한 걸음입니다.

  u05:
    title: 흔들려도 무너지지 않는 피난처
    before: >
      세상이, 관계가, 내 마음까지 흔들리는 날이 있습니다.
      뉴스도, 대화도, 내 안도 조용하지 않은 날.
      시편 사십육 편은 땅이 변하고 산이 흔들려도
      하나님은 우리의 피난처시라고 노래합니다.
      흔들림을 없다고 하지 않습니다.
      흔들림 속에서도 숨을 둘 곳이 있다고 말합니다.
    mid: >
      ‘피난처’라는 단어는 도망의 언어처럼 들리기도 합니다.
      그러나 여기서의 피난은 현실을 외면하는 도피가 아니라,
      다시 일어서기 위한 쉼의 자리일 수 있습니다.
    after: >
      피난처는 도망치는 곳이 아니라, 숨을 고르는 곳입니다.
      잠시 멈춰도 괜찮습니다.
      흔들림 자체를 부끄러워하지 마세요.
      흔들리는 사람은, 아직 살아 있는 사람입니다.
      오늘은 흔들림을 잠재우기보다,
      흔들리면서도 숨이 이어지게 하는 쪽으로 마음을 두어 보세요.

  u06:
    title: 숨는 자리, 머무는 자리
    before: >
      시편 구십일 편은 오래전부터 밤의 두려움과 낮의 위협 한가운데서
      읽혀 온 말씀입니다.
      전염병, 화살, 함정 같은 이미지가 등장하지만,
      그 중심에는 ‘거한다’는 머무름이 있습니다.
      먼저 앞부분을 천천히 듣겠습니다.
      무서운 목록에 마음이 빼앗기기보다,
      어디에 거하느냐는 질문에 귀를 기울여 보세요.
    mid: >
      거한다는 것은 잠시 스쳐 가는 방문이 아닙니다.
      반복해서 돌아오는 자리, 습관처럼 마음을 두는 자리입니다.
      오늘 밤 당신의 마음이 자꾸 떠돈다면,
      떠도는 것 자체를 자책하기보다, 돌아올 문장을 하나 정해 두어도 좋습니다.
    after: >
      오늘 밤, 당신 마음이 쉴 곳을 찾지 못하고 떠돈다면,
      이 구절을 그 머무름의 자리처럼 두어도 좋습니다.
      완벽히 이해되지 않아도 됩니다.
      이해보다 먼저 필요한 것은 때로 안심입니다.
      안심이 오면, 이해는 천천히 따라오기도 합니다.

  u07:
    title: 지켜 주시는 손길
    before: >
      같은 시편 구십일 편의 뒷부분입니다.
      위협의 목록이 이어지지만, 그 중심에는 버림받지 않는다는 약속이 있습니다.
      ‘내가 그와 함께 하리라’는 문장은,
      위험이 없다는 뜻이 아니라 동행이 있다는 뜻에 가깝습니다.
    mid: >
      현대의 우리는 안전을 통제로 착각할 때가 있습니다.
      모든 변수를 관리해야 마음이 놓이는 밤.
      그러나 이 시편은 통제가 아니라 동행을 말합니다.
      통제할 수 없는 밤에도, 함께 함이 있을 수 있다고.
    after: >
      모든 위험이 사라진다는 보장을 드리는 것은 아닙니다.
      다만, 위험 속에서도 동행의 언어가 있다는 것을
      오늘 마음에 남겨 두셨으면 합니다.
      당신은 버려진 존재가 아닙니다.
      오늘 하루를 통과해 이 순간까지 온 당신 곁에,
      이 문장을 잠시 두어 보세요.

  u08:
    title: 눈을 들어 산을 보는 밤
    before: >
      도움이 어디서 올까, 막막할 때 시편 백이십일 편은
      눈을 들어 산을 본다고 말합니다.
      산 자체가 답이 아니라, 그 너머를 지키시는 분을 바라보는 시선입니다.
      밤에는 시야가 좁아집니다.
      그럴수록 고개를 조금 들어 보는 일이 필요할 때가 있습니다.
    mid: >
      ‘지키시는 이가 졸지도 아니하시고’라는 표현은
      감시가 아니라 돌봄의 언어로 들립니다.
      잠들지 않는 돌봄, 끄달리지 않는 관심.
      당신이 애쓰지 않아도 유지되는 돌봄이 있다는 상상은
      때로 긴장을 조금 풀어 줍니다.
    after: >
      지키신다는 말은, 당신을 감시한다는 뜻이 아닙니다.
      잠들지 않고 곁에 계신다는, 오래된 돌봄의 언어입니다.
      지금 이 순간에도, 당신의 들숨과 날숨이 이어지고 있다면
      그 자체로 이미 돌봄 안에 있는 것일 수 있습니다.
      숨을 한 번 더, 천천히 쉬어 보세요.

  u09:
    title: 두려워 말라 — 이사야의 손
    before: >
      구약의 예언서 이사야에도, 떨리는 마음을 직접 붙드는 문장이 있습니다.
      ‘두려워 말라 내가 너와 함께 함이니라.’
      명령처럼 들리지만, 그 안에는 동행의 약속이 먼저 있습니다.
      시편의 노래 다음에 예언의 음성을 이어 듣는 것은,
      같은 위로가 다른 목소리로 반복된다는 느낌과 닮아 있습니다.
    mid: >
      ‘내가 너를 굳세게 하리라’ ‘참으로 너를 도와 주리라’는 문장은
      혼자 버틸 힘을 억지로 짜내라는 말이 아닙니다.
      붙들어 주는 힘이 바깥에도 있다는 약속에 가깝습니다.
    after: >
      두려워하지 말라는 말이, 두려움을 억누르라는 뜻은 아닙니다.
      ‘네가 혼자가 아니다’라는 안심에 더 가깝습니다.
      오늘 손이 떨린다면, 그 손을 꼭 쥐고
      한 박자만 천천히 걸어 보세요.
      빠른 해결이 없어도, 동행의 감각이 있으면
      밤의 밀도가 조금 달라질 수 있습니다.

  u10:
    title: 마음에 지키는 평강
    before: >
      불안은 때로 생각이 너무 많아서 생깁니다.
      같은 장면을 반복 재생하고, 아직 오지 않은 대화를 미리 쓰는 일.
      이사야 이십육 장은, 중심을 주께 두는 이에게 평강이 있다고 말합니다.
      완벽한 집중이 아니라, 마음이 돌아갈 곳을 정하는 일에 가깝습니다.
    mid: >
      중심이라는 단어는 거창하게 들릴 수 있습니다.
      그러나 실무적으로는 ‘지금 이 호흡’ ‘지금 이 문장’처럼
      아주 작은 앵커일 수도 있습니다.
      평강은 큰 결단 이전에, 작은 귀환으로 시작되기도 합니다.
    after: >
      평강은 감정이 항상 고요하다는 뜻이 아닐 수 있습니다.
      파도가 있어도, 그 아래에 더 깊은 층이 있는 것처럼.
      지금 표면이 요동쳐도, 당신 안의 깊은 곳에
      숨을 둘 자리를 하나 남겨 두세요.
      그 자리를 오늘 밤의 중심으로 삼아도 좋습니다.

  u11:
    title: 도망쳐도 닿는 시선
    before: >
      사람들이 붐비는 곳에서도, 혼자 있는 방 안에서도
      아무도 나를 모른다고 느낄 때가 있습니다.
      시편 백삼십구 편은, 어디를 가든 이미 알고 계신다는 노래입니다.
      도망치고 싶을 때도, 그 도망의 경로까지 알고 계신다는 고백은
      감시처럼 무서울 수도, 돌봄처럼 따뜻할 수도 있습니다.
      오늘 우리는 돌봄의 결로 듣겠습니다.
    mid: >
      ‘내가 주의 영을 떠나 어디로 가며’라는 질문은
      숨을 곳이 없다는 절망이 아니라,
      완전히 혼자가 되는 일이 없다는 발견으로 이어집니다.
    after: >
      완전히 이해받지 못한 채 살아가는 날이 있습니다.
      그래도 이 시편은 말합니다. 당신은 보이지 않는 존재가 아니라고.
      오늘 그 말 하나만, 마음에 천천히 내려놓아 보세요.
      보여진다는 사실이 부담이 아니라
      ‘그래도 내가 있다’는 확인이 되기를 바랍니다.

  u12:
    title: 상한 마음을 가까이하시는 분
    before: >
      시편 삼십사 편은 찬양으로 시작하지만,
      그 안에는 상한 심령을 외면하지 않으신다는 고백이 있습니다.
      상했다는 사실을 숨기지 않아도 되는 자리입니다.
      웃어야 하는 자리에서 웃고, 괜찮은 척해야 하는 하루를 보냈다면,
      이 밤만큼은 괜찮은 척을 내려놓아도 됩니다.
    mid: >
      상한 마음을 가까이하신다는 문장은
      빠른 수리를 약속하기보다, 거리를 좁히시겠다는 약속처럼 들립니다.
      고치기 전에 먼저 다가오시는 손길.
    after: >
      상한 마음은 고쳐야 할 결함이기 전에,
      당신이 무언가를 진심으로 아끼고 살아 왔다는 흔적일 수 있습니다.
      오늘 그 마음을 재촉하지 마세요.
      천천히, 함께 가도 됩니다.
      치유는 한 번의 결단이 아니라,
      여러 번의 다정한 반복으로 오기도 합니다.

  u13:
    title: 목이 마른 영혼
    before: >
      시편 사십이 편은 목마른 사슴의 이미지로 시작합니다.
      영혼이 갈증을 느낄 때, 그것은 약함이 아니라
      살아 있음의 신호일 수도 있습니다.
      아무것도 원하지 않게 된 무감각보다,
      목이 마르다는 감각이 남아 있다면
      아직 생명 쪽으로 기울어 있는 것일 수 있습니다.
    mid: >
      ‘내 영혼아 네가 어찌하여 낙심하며’라는 말은
      스스로를 다그치는 소리처럼 들리기도, 다독이는 소리처럼 들리기도 합니다.
      오늘 우리는 다독임의 결로 듣겠습니다.
    after: >
      낙심해도 됩니다.
      그리고 그 낙심 속에서도 다시 소망을 말해 볼 수 있습니다.
      오늘은 그 정도면 충분합니다.
      크게 기뻐지지 않아도, 내일의 작은 빛을 상상하는 일.
      그것만으로도 밤을 지나는 방식이 될 수 있습니다.

  u14:
    title: 다시, 평안히 눕는 밤
    before: >
      처음 들었던 시편 사 편의 마지막 구절로 돌아갑니다.
      같은 문장도, 밤의 끝에서 다시 들으면 다르게 닿을 때가 있습니다.
      여행의 출발지와 도착지가 같은 좌표여도
      그 사이 걸어 온 길이 사람을 바꾸듯,
      이 한 절이 지금의 당신에게 다시 닿기를 바랍니다.
    mid: >
      짧게 한 절만 듣겠습니다.
      길지 않아도 됩니다.
      긴 밤의 마지막은 때로 아주 짧은 문장으로 충분합니다.
    after: >
      평안히 눕는다는 것은 완벽한 하루의 보상이 아닙니다.
      불완전한 하루 끝에도 허락되는 쉼입니다.
      눈을 감아도 좋습니다.
      이 밤이 당신을 통과해 지나가도록, 잠시 몸을 맡겨 보세요.
      내일의 당신은, 오늘의 당신이 쉬었기에 조금 더 나아갈 수 있을지도 모릅니다.
      지금은 그 ‘조금’을 위해 숨을 고르는 시간입니다.

  u15:
    title: 밤에도 나를 훈계하시는 마음
    before: >
      시편 십육 편은 짧은 시이지만, 피난처와 분깃과 기쁨의 언어가 겹칩니다.
      불안한 밤은 때로 ‘내가 무엇을 붙들고 있나’를 묻게 합니다.
      붙들 것이 미끄러질 때, 이 시편은 다른 근거를 가리킵니다.
    mid: >
      ‘내가 여호와를 항상 내 앞에 모심이여’라는 문장은
      완벽한 집중의 의무가 아니라, 방향을 정하는 습관처럼 들립니다.
    after: >
      방향을 정했다는 것만으로 불안이 사라지지는 않을 수 있습니다.
      그러나 방향이 있으면, 같은 불안 안에서도 발걸음의 의미가 달라집니다.
      오늘 밤 당신이 붙들 문장을 하나만 고른다면, 그것만으로도 충분합니다.

  u16:
    title: 부끄럽지 않게 하소서
    before: >
      시편 삼십일 편 초입은 피난처를 구하는 절박한 목소리입니다.
      ‘내가 주께 피하오니’라는 말은, 더 이상 혼자 버틸 힘이 없을 때의 언어와 닮아 있습니다.
      버티는 것이 미덕인 세상에서도, 피하고 기대는 것은 수치의 반대편에 있을 수 있습니다.
    mid: >
      기대는 일은 포기가 아닙니다.
      무게를 나눌 곳을 찾는 지혜일 수 있습니다.
    after: >
      오늘 당신이 너무 오래 혼자 짊어졌다면,
      그 무게의 일부를 내려놓는 상상을 해 보세요.
      내려놓는다고 당신이 작아지지 않습니다.
      오히려 숨 쉴 자리가 생깁니다.

  u17:
    title: 저녁에 아뢰는 기도
    before: >
      시편 오십오 편 후반부는 낮의 소란 뒤에 남는 저녁의 기도처럼 들립니다.
      ‘저녁과 아침과 정오에 내가 근심하여 탄식하리니’ —
      하루 세 번 마음이 무거울 수 있다는 사실을, 시편은 이미 알고 있습니다.
    mid: >
      근심을 하루 일정처럼 인정하는 문장은 이상하게 위로가 됩니다.
      근심이 비정상이 아니라, 인간됨의 일부일 수 있다는 허락처럼.
    after: >
      근심을 없애야만 잠들 수 있는 것은 아닙니다.
      근심 옆에서 숨을 고르는 밤도 있습니다.
      오늘 그 밤이 당신에게 허락되기를 바랍니다.

  u18:
    title: 잠잠히 기다림
    before: >
      시편 육십이 편은 ‘나의 영혼이 잠잠히 하나님만 바람이여’라고 시작합니다.
      불안은 종종 소음입니다. 설명, 예측, 자책의 소음.
      잠잠함은 무관심이 아니라, 그 소음 사이에서 중심을 되찾는 일입니다.
    mid: >
      현대의 우리는 즉시 응답에 익숙합니다.
      그러나 이 시편은 기다림을 약함이 아니라 신뢰의 형태로 그립니다.
    after: >
      기다림이 길어도, 당신은 정지된 사람이 아닙니다.
      숨은 계속 움직이고, 마음은 천천히 정돈됩니다.
      오늘 밤의 잠잠함을, 게으름이 아니라 치유의 리듬으로 받아들여 보세요.

  u19:
    title: 마른 땅 같은 밤
    before: >
      시편 육십삼 편은 광야의 갈증으로 시작합니다.
      영혼이 마르고, 육체가 쇠약한 상태.
      오늘 당신의 밤이 그와 비슷하다면, 이 시편은 먼 이야기가 아닙니다.
    mid: >
      갈증을 느낀다는 것은 물이 필요하다는 신호입니다.
      신호를 무시하지 않는 것이 회복의 시작일 수 있습니다.
    after: >
      무엇이 당신 영혼에 물과 같은지, 오늘 밤 천천히 떠올려 보세요.
      큰 해답이 아니어도 됩니다.
      따뜻한 차 한 잔, 조용한 호흡, 이 말씀의 한 줄 —
      작은 물도 목을 축입니다.

  u20:
    title: 새 힘을 얻는 아침을 기다리며
    before: >
      이사야 사십 장은 지친 이들에게 자주 읽히는 본문입니다.
      ‘피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니’
      능력은 원래 센 사람의 전유물이 아니라,
      지친 사람에게 다시 주어지는 선물처럼 묘사됩니다.
    mid: >
      독수리가 날개 치며 올라가는 이미지는 과장된 성공이 아닙니다.
      다시 뜨는 힘, 다시 걷는 힘, 그리고 지쳐도 기력하는 힘 —
      단계가 다른 회복을 모두 품고 있습니다.
    after: >
      오늘 당신에게 필요한 힘이 ‘비상’이 아니라 ‘한 걸음’이어도 됩니다.
      걷고, 달리고, 날아오르는 순서가 모두에게 같지 않습니다.
      지금의 속도가 느려도, 그 속도 그대로 존중받아도 좋습니다.

  u21:
    title: 들을 귀가 있는 사랑
    before: >
      시편 백십육 편은 ‘여호와께서 내 음성과 내 간구를 들으시므로’로 시작합니다.
      불안한 밤의 핵심 갈증 중 하나는 ‘누가 내 말을 들어 줄까’입니다.
      이 시편은 들림 받음의 기쁨을 노래합니다.
    mid: >
      들어 준다는 것은 즉시 해결책을 주는 일과 다릅니다.
      존재의 무게를 함께 지는 일에 가깝습니다.
    after: >
      오늘 당신의 이야기도 들을 가치가 있습니다.
      정리되지 않은 이야기여도 됩니다.
      완벽하게 설명되지 않아도, 마음은 이미 말하고 있습니다.
      그 마음에 귀 기울이는 밤이 되기를 바랍니다.

  u22:
    title: 깊음 속에서 부르는 소리
    before: >
      시편 백삼십 편은 깊음 속에서 주를 부른다고 말합니다.
      깊은 곳은 실패의 구덩이일 수도, 슬픔의 우물일 수도 있습니다.
      중요한 것은, 그 깊음 속에서도 소리가 나온다는 사실입니다.
    mid: >
      부르짖음은 믿음이 없어서가 아니라,
      아직 관계를 포기하지 않았다는 신호일 수 있습니다.
    after: >
      오늘 당신의 깊음이 어디든, 그 자리에서 나는 소리도 소중합니다.
      작은 신음이어도 됩니다.
      소리가 있는 한, 연결의 가능성은 남아 있습니다.

  u23:
    title: 모태에서부터 아신 나
    before: >
      시편 백삼십구 편 중반부는 존재가 지어진 신비로 이어집니다.
      성과와 무관하게, 존재 자체가 헤아림 받았다는 고백입니다.
      불안이 ‘나는 충분하지 않다’고 말할 때,
      이 본문은 다른 기준으로 당신을 바라봅니다.
    mid: >
      가치는 생산량으로만 측정되지 않습니다.
      숨 쉬는 당신, 여기 있는 당신, 그 자체가 이미 이야기의 시작입니다.
    after: >
      오늘 스스로를 평가하는 점수가 가혹하다면,
      그 점수표를 잠시 접어 두세요.
      당신은 성과 이전의 존재로도 충분히 귀합니다.

  u24:
    title: 기다리고 또 기다리는 마음
    before: >
      시편 이십칠 편 후반은 구하고 찾고 기다리는 언어로 가득합니다.
      불안은 종종 기다림을 견디지 못합니다.
      그래서 이 시편의 마지막 ‘강하고 담대하며 기다려라’는 말이
      오늘 밤의 주문처럼 들릴 수 있습니다.
    mid: >
      담대함은 고함과 다릅니다.
      흔들리면서도 자리를 지키는 조용한 힘일 수 있습니다.
    after: >
      기다림 중에도 당신은 무능하지 않습니다.
      기다리는 동안 숨을 쉬고, 몸을 돌보고, 이 말씀을 듣는 일 —
      그것이 오늘의 담대함일 수 있습니다.

  u25:
    title: 상한 자를 가까이하시는 시선
    before: >
      시편 삼십사 편 후반부는 의인과 고난, 그리고 여호와의 눈을 말합니다.
      고난이 곧 버림의 증거는 아니라는 방향으로 읽힐 수 있습니다.
      오늘 고난 가운데 있다면, 이 시선이 당신 곁에 머무르기를 바랍니다.
    mid: >
      가까이 계신다는 감각은 즉시 오지 않을 수 있습니다.
      그래도 문장을 반복해 듣는 일은, 감각이 돌아올 자리를 예비합니다.
    after: >
      고난이 당신을 정의하지 못하게 하세요.
      고난은 지나가는 계절일 수 있고,
      당신은 그 계절을 지나고 있는 사람입니다.
      지나는 중이라면, 이미 움직임이 있는 것입니다.

  u26:
    title: 아침마다 새로운 긍휼
    before: >
      마지막으로 예레미야애가의 한 구절을 듣습니다.
      애가라는 이름은 슬픔의 노래이지만,
      그 한가운데에 ‘아침마다 새로울지라’는 문장이 빛처럼 남아 있습니다.
      밤이 긴 책 안에서 발견된 아침의 약속입니다.
    mid: >
      새로운 긍휼은 어제의 실패를 없던 일로 만들라는 뜻이 아닙니다.
      오늘이라는 하루가 다시 주어진다는 뜻에 가깝습니다.
    after: >
      이 밤이 지나가면 아침이 옵니다.
      아침이 모든 걸 해결하지 못해도,
      새로운 숨이 주어진다는 사실만으로도 시작할 수 있습니다.
      지금은 그 아침을 믿으며, 몸을 쉬게 할 시간입니다.
      여기까지 함께해 주셔서 감사합니다. 곧 클로징으로 이어집니다.

closing:
  - speaker: narrator
    text: >
      여기까지, 불안한 밤을 위한 말씀을 함께 읽었습니다.
      모든 걱정이 사라진 것은 아닐 수 있습니다.
      그래도 이 시간이, 당신 마음에 작은 숨구멍을 남겨 두었다면 그것으로 충분합니다.
      위로란 때로 문제를 없애는 일이 아니라,
      문제 옆에서 숨 쉴 자리를 만드는 일이기도 합니다.
  - speaker: narrator
    text: >
      내일 아침이 오면, 다시 할 일이 있을 것입니다.
      그때까지는, 애쓴 몸을 조금 쉬게 해 주세요.
      당신은 오늘의 무게를 견디며 여기까지 왔습니다.
      그 사실만으로도 귀합니다.
      자신을 다그쳤던 문장이 있다면, 오늘 밤만큼은 그 문장을 잠시 끄워 두세요.
  - speaker: narrator
    text: >
      이 영상이 도움이 되었다면, 잠들기 전 다시 틀어 두셔도 좋습니다.
      평안한 밤 되시기를 바랍니다.
      감사합니다.
