# ep01 키워드·모티프 계약 (시간 없음 — lock 후 build_plate_timeline 이 배정)
episode_id: ep01_anxious_night
policy:
  minutes_per_plate_target: 10
  dwell_warn_min_sec: 360
  dwell_warn_max_sec: 840
  motion_default: still
  kenburns_zoom_total_max: 0.04
  crossfade_sec: 1.5
  crossfade_required_in_smoke: false
  no_text_in_image: true
  # hard: scripture consecutive block never splits plates
  forbid_plate_change_inside_scripture: true
  prefer_unit_integrity: true

plates:
  - id: P01
    keywords: [밤, 잠, 숨, 불안, 목자]
    motif: bedroom_moonlight_window
    preferred_unit_ids: [opening, u01, u02, u03]
    asset: assets/generated/ep01/plates/P01.jpg
    fallback_asset: assets/generated/ep01/motif_window_1080.jpg
    prompt: >
      Photoreal calm bedroom at night, soft moonlight through sheer curtains,
      empty room, no people, no text, no logos, 16:9 ambient meditation still

  - id: P02
    keywords: [빛, 피난처, 거함, 안전]
    motif: candle_safe_room
    preferred_unit_ids: [u04, u05, u06]
    asset: assets/generated/ep01/plates/P02.jpg
    fallback_asset: assets/generated/ep01/motif_candle_1080.jpg
    prompt: >
      Single warm candle in a quiet dark room, soft glow, empty of people,
      no text, no logos, 16:9 peaceful ambient still

  - id: P03
    keywords: [지킴, 산, 두려워, 손]
