[pytest]
pythonpath = .
testpaths = bible_healing/tests modern/tests human_archive/tests
norecursedirs = .* build dist runs scratch node_modules audits sources static templates __pycache__
python_files = test_*.py
addopts = -v --basetemp=D:/module/scratch/pytest_tmp
markers =
    media_heavy: FFmpeg/media integration test; exclude with '-m "not media_heavy"' for fast unit runs.
